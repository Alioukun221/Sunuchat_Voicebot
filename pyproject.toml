[project]
name = "sunuchat"
version = "0.1.0"
description = "SunuChat : assistant santé WhatsApp en wolof et pulaar (texte et vocal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "google-adk[db]>=2.11.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sunuchat = "sunuchat.main:run"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

